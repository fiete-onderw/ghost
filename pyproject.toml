[project]
name = "ghost"
version = "0.1.0"
description = "Zichtbare, tijdelijke locatiesimulatie voor je eigen iPhone - veiligheid eerst."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "GPL-3.0-or-later"
dependencies = [
    # Exact vastgepind: deze library verandert bijna dagelijks. Bijwerken doe je
    # bewust (later via update.bat), nooit per ongeluk.
    "pymobiledevice3==11.53.0",
    # De webserver achter de pagina in je browser. pymobiledevice3 gebruikt
    # dezelfde twee pakketten zelf ook; hier staan ze erbij omdat Ghost ze nu
    # rechtstreeks gebruikt. Ook exact vastgepind.
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    # Alleen voor de tests: hiermee doet een test alsof hij een browser is.
    "httpx>=0.28",
]

[tool.uv]
# Ghost wordt niet als pakket gebouwd of geinstalleerd; je start het vanuit
# deze map met `uv run python -m ghost`. Dat scheelt een bouwstap.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
